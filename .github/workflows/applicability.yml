# Applicability merge gate. Not Open Code Review.
# Write-time: openspec/specs/secure-by-construction.md and
# .cursor/skills/secure-by-construction/SKILL.md
# pull_request_target runs this YAML from the base branch so a PR
# cannot rewrite the gate. No repository secrets. Do not execute
# files from the PR tree; only parse them as data.
# Keep pull_request so this change can land while base still lists it.

name: Applicability gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: applicability-${{ github.event.pull_request.number }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  applicability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted checker from the PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout PR tree as data only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false

      - name: Fetch base branch for the diff
        run: git fetch --no-tags origin ${{ github.base_ref }}
        working-directory: pr

      - name: Self-test checker
        run: python3 scripts/check-secure-by-construction-applicability.py --self-test

      - name: Require 適用表 on gated paths
        run: python3 scripts/check-secure-by-construction-applicability.py --root pr --base origin/${{ github.base_ref }}
