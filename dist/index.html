<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TermForge: Asteroids (WebAssembly)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />
  <link rel="stylesheet" href="crt.css" />
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
</head>
<body>

<div class="crt-container">
  <div class="crt-bezel-header">
    <span class="brand-badge">TERMVTC-80 // RUST WASM</span>
    <span>60 FPS DOUBLE-BUFFERED</span>
    <span style="color: var(--crt-amber);">ASTEROIDS ARCADE</span>
  </div>

  <div class="crt-screen">
    <div id="terminal-container"></div>
  </div>
</div>

<!-- Mobile Touch Virtual Controls -->
<div class="touch-controls">
  <div style="display: flex; gap: 10px;">
    <button class="touch-btn" id="btn-left">◀</button>
    <button class="touch-btn" id="btn-right">▶</button>
  </div>
  <div style="display: flex; gap: 10px;">
    <button class="touch-btn" id="btn-thrust" style="color: var(--crt-amber);">▲ THRUST</button>
    <button class="touch-btn" id="btn-fire" style="color: var(--crt-cyan);">● FIRE</button>
  </div>
</div>

<script type="module">
  import init, { WasmAsteroidsGame } from './pkg/termforge_web.js';

  // Web Audio Synth for retro sound effects
  class RetroSoundManager {
    constructor() {
      this.ctx = null;
    }
    init() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    playLaser() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(880, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.12);
    }
    playHit() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.15);
    }
    playExplosion() {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, this.ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.35);
      gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start();
      osc.stop(this.ctx.currentTime + 0.35);
    }
  }

  const sound = new RetroSoundManager();

  async function start() {
    await init();

    const termCols = 80;
    const termRows = 24;

    const term = new Terminal({
      cols: termCols,
      rows: termRows,
      cursorBlink: false,
      cursorStyle: 'underline',
      theme: {
        background: '#050805',
        foreground: '#33ff66',
        cursor: '#33ff66',
        black: '#000000',
        red: '#ff3333',
        green: '#33ff66',
        yellow: '#ffb000',
        blue: '#3399ff',
        magenta: '#cc33ff',
        cyan: '#00ffff',
        white: '#ffffff',
        brightBlack: '#555555',
        brightRed: '#ff6666',
        brightGreen: '#66ff99',
        brightYellow: '#ffd24d',
        brightBlue: '#66b3ff',
        brightMagenta: '#df80ff',
        brightCyan: '#80ffff',
        brightWhite: '#ffffff',
      },
      fontFamily: 'Courier New, monospace',
      fontSize: 16,
      letterSpacing: 1,
      lineHeight: 1.1,
    });

    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    window.addEventListener('resize', () => {
      fitAddon.fit();
    });

    const game = new WasmAsteroidsGame(termCols, termRows);

    // Keyboard listeners
    window.addEventListener('keydown', (e) => {
      sound.init();
      game.key_down(e.key);
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      game.key_up(e.key);
    });

    // Touch button listeners
    const setupTouchBtn = (id, keyName) => {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        sound.init();
        game.key_down(keyName);
      });
      btn.addEventListener('touchend', (e) => {
        e.preventDefault();
        game.key_up(keyName);
      });
    };

    setupTouchBtn('btn-left', 'ArrowLeft');
    setupTouchBtn('btn-right', 'ArrowRight');
    setupTouchBtn('btn-thrust', 'ArrowUp');
    setupTouchBtn('btn-fire', ' ');

    let lastTime = performance.now();

    function loop(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000.0, 0.1);
      lastTime = currentTime;

      const ansiDiff = game.tick(dt);
      if (ansiDiff && ansiDiff.length > 0) {
        term.write(ansiDiff);
      }

      const sfx = game.last_sound();
      if (sfx === 'fire') sound.playLaser();
      else if (sfx === 'hit') sound.playHit();
      else if (sfx === 'explosion') sound.playExplosion();

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  }

  start().catch(console.error);
</script>

</body>
</html>
